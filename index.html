<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Bread – Votre liseuse hors-ligne BoomBooks. Lisez vos livres achetés partout, sans connexion." />
    <meta name="theme-color" content="#0B0F14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BRead" />
    <title>BRead – Liseuse BoomBooks</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Capture PWA install prompt BEFORE React loads (must not miss this event)
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new Event('app-installable'));
        console.log('✅ PWA installable');
      });
      window.addEventListener('appinstalled', function() {
        window.deferredPrompt = null;
        window.dispatchEvent(new Event('app-installed'));
        console.log('✅ PWA installed');
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
